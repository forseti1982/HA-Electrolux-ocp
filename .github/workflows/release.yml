name: Release

# Erstellt automatisch ein GitHub-Release, sobald ein Versions-Tag (vX.Y.Z)
# gepusht wird. HACS zeigt Versionen aus Releases — so ist jede getaggte
# Version sofort installierbar, ohne manuelles "Publish release".
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
